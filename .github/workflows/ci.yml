name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required files
        run: |
          test -f main.ts
          test -f serve.ts
          test -f shots.json
          test -f README.md
          test -f LICENSE
          test -f app/index.html
          test -f app/style.css
          test -f app/src/main.js
      - name: Check JS syntax
        run: |
          for f in app/src/*.js; do node --check "$f"; done
      - name: Check screenshots exist
        run: |
          test -f screenshots/1-cover.jpg
          test -f screenshots/2-editor.jpg
          test -f screenshots/3-cover-portrait.jpg
          test -f screenshots/4-cover-square.jpg
